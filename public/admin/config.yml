# Sveltia CMS 配置文件
# 文档: https://github.com/sveltia/sveltia-cms

# 后端配置 - 使用 GitHub
backend:
  name: github
  repo: Tomorrowdawn/my-site
  branch: main
  base_url: https://api.github.com
  auth_endpoint: /api/auth

# 媒体文件配置
media_folder: "src/content/posts/{{slug}}/images"  # 图片保存路径（每篇文章独立文件夹）
public_folder: "images"  # Markdown 中引用图片的相对路径

# 本地开发配置（可选）
# local_backend: true

# 集合配置
collections:
  - name: "posts"
    label: "博客文章"
    label_singular: "文章"
    folder: "src/content/posts"
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    preview_path: "posts/{{slug}}"

    # 编辑器配置
    editor:
      preview: true  # 启用实时预览

    # 字段定义
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        required: true

      - label: "标签"
        name: "tags"
        widget: "select"
        multiple: true
        required: true
        default: ["other"]
        options:
          - { label: "数学", value: "math" }
          - { label: "哲学", value: "philosophy" }
          - { label: "代码", value: "code" }
          - { label: "其他", value: "other" }

      - label: "创建日期"
        name: "createdAt"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: true

      - label: "原文链接"
        name: "origin"
        widget: "string"
        required: false
        hint: "如果文章转载自其他平台，填写原文链接"

      - label: "摘要"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "文章摘要，用于首页展示（可选，留空则自动提取）"

      - label: "正文"
        name: "body"
        widget: "markdown"
        required: true
        hint: "支持 Markdown 语法和 LaTeX 数学公式（使用 $ 或 $$ 包裹）"
